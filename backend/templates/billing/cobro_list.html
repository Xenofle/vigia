{% extends "common/base_intranet.html" %}


{% block main_content %}
<div class="container">
    <h1>Lista de cobros</h1>
    <ul class="list-group mt-3">
    {% for cobro in object_list %}
        <a href="{% url 'cobro_detail' cobro.id %}" class="list-group-item list-group-item-action">{{ cobro }}</a>
    {% empty %}
        <p>No existen cobros.</p>
    {% endfor %}
    </ul>
</div>
{% endblock main_content %}
